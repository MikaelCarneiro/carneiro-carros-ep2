{% extends "base.html" %}
{% block content %}
<div class="hero"><h1>Confirmar exclusão</h1></div>
<form method="post" class="panel">
  {% csrf_token %}
  <p>Deseja excluir a publicação <strong>{{ post.title }}</strong>?</p>
  <div class="actions">
    <button type="submit" class="danger">Confirmar exclusão</button>
    <a href="{% url 'blog:post_detail' post.pk %}">Cancelar</a>
  </div>
</form>
{% endblock %}
